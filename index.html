<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبد خرید</title>

    <!-- Sweet Alert 2 CSS -->
    <link rel="stylesheet" href="./assets/libs/sweetalert2/sweetalert2.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="./assets/icons/FontAwesome/css/all.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="base-header">
          <!-- Right Section -->
          <div class="header-right">
            <img src="./assets/images/logo.svg" alt="logo" class="logo-image" />
            <div class="search-container">
              <i class="fa-regular fa-search search-icon"></i>
              <input type="search" name="search" class="search-input" id="serachInput" placeholder="محصول مورد نظر را جستجو کنید ..." />
            </div>
          </div>

          <!-- Left Section -->
          <div class="header-left">
            <div class="user-actions">
              <a href="#" class="login-link">ورود</a>
              <a href="#" class="register-link">ثبت نام</a>
            </div>

            <div class="cart-container">
              <button class="cart-icon-container" id="openCartBtn">
                <i class="fa-light fa-cart-shopping cart-icon"></i>
                <span class="cart-item-count total-count"></span>
              </button>

              <!-- Cart box-->
              <div class="cart-box invisible">
                <!-- Empty cart component is rendered using JavaScript. -->
                <div class="cart-header">
                  <div class="header-content">
                    <div>
                      <span class="cart-header-title">سبد خرید شما</span>
                      <span class="cart-total-count total-count"></span>
                      <span class="cart-item-label">عدد کالا</span>
                    </div>
                    <div>
                      <button type="button" class="clear-all-btn">
                        حذف کل سبد خرید
                        <i class="fa fa-regular fa-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="cart-body">
                  <!-- Products in the shopping cart are rendered using JavaScript. -->
                </div>

                <div class="cart-footer">
                  <button type="button" class="submit-order-button">
                    <p class="submit-order-text">ثبت سفارش</p>
                    <p class="final-total-price">
                      <span class="total-cart-price"></span>
                      <span class="total-cart-price-currency">تومان</span>
                    </p>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- Banner -->
      <div class="banner">
        <img src="./assets/images/banner.webp" alt="banner" class="banner-image" />
      </div>

      <!-- Products List -->
      <div class="container">
        <h2 class="featured-products">محصولات برتر</h2>

        <div class="no-results-container hidden">
          <img src="./assets/images/not-found-product.webp" alt="" class="no-results-image" />
          <p class="no-results-message">کالایی یافت نشد.</p>
        </div>

        <div class="products-container">
          <!-- Products are rendered using JavaScript. -->
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer-content">
          <p class="footer-text">تمامی حقوق مادی و معنوی این سایت محفوظ می‌باشد.</p>
        </div>
      </div>
    </footer>

    <!-- Sweet Alert 2 JS -->
    <script src="./assets/libs/sweetalert2/sweetalert2@11.js"></script>

    <!-- Data -->
    <script src="./js/data.js"></script>

    <!-- Main JS -->
    <script src="./js/main.js"></script>
  </body>
</html>
